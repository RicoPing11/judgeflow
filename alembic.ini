[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# 仅用于本机隔离 Demo；部署或共享环境必须通过私有配置覆盖。
sqlalchemy.url = postgresql+psycopg://judgeflow:judgeflow@127.0.0.1:5432/judgeflow

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
