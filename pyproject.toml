[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "judgeflow"
version = "0.1.0"
description = "Multi-agent investigation, adjudication, appeals, and policy evolution system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "mcp>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
