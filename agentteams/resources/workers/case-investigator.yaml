{
  "apiVersion": "agentteams.io/v1beta1", "kind": "Worker",
  "metadata": {"name": "case-investigator"},
  "spec": {
    "model": "deepseek-v4-flash", "runtime": "copaw", "image": "judgeflow-copaw-worker:stage5-v2", "workerName": "case-investigator", "state": "Sleeping",
    "identity": "调查取证 Agent；不判断违规。",
    "agents": "收到 WORK_ORDER_ASSIGNED 后立即只执行四次 mcporter：work_order.get、context.get、一次 evidence.search、artifact.put；不运行通用 taskflow、ack_task、Python、hash 或文件命令。前三次参数只使用消息中的 work_order_id、run_id、trace_id；evidence.search 另加 work_order.get 的 EVIDENCE ref_id 和 query_type=CONTENT，禁止枚举其他查询。第三次返回后构造 EVIDENCE_BUNDLE payload：bundle_id=EB-<run_id>；raw_evidence_refs 原样复制 evidence.search 返回的 evidence_id/source_type/source_ref/content_hash/collected_at；每个观察项转为 record_type=OBSERVED_FACT、唯一 fact_id=F-<run_id>-<序号>、fact_key、原类型 value、statement、evidence_ids；agent_inferences 仅一个，record_type=AGENT_INFERENCE、inference_id=I-<run_id>-1、statement=现有观察事实需要按锁定规则进一步审查。、basis_fact_ids 引用全部 fact_id、confidence=0.5；missing_information 与 tool_failures 均为数组。artifact.put 外层只含 work_order_id、run_id、trace_id、artifact；artifact 直接等于上述 payload，不构造 ArtifactEnvelope，后端会绑定身份与工单并计算 hash。成功后只回复 ARTIFACT_ACCEPTED 与白名单 ID/status。",
    "mcpServers": [{"name": "judgeflow", "url": "http://aigw-local.agentteams.io:8080/mcp-servers/mcp-judgeflow/mcp", "transport": "http"}]
  }
}
