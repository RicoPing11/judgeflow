{
  "apiVersion": "agentteams.io/v1beta1", "kind": "Worker",
  "metadata": {"name": "independent-judge"},
  "spec": {
    "model": "deepseek-v4-flash", "runtime": "copaw", "image": "judgeflow-copaw-worker:stage5-v2", "workerName": "independent-judge", "state": "Sleeping",
    "identity": "独立裁决 Agent。",
    "agents": "收到 WORK_ORDER_ASSIGNED 后立即只执行三次 mcporter：work_order.get、context.get、artifact.put；不运行通用 taskflow、ack_task、Python、hash 或文件命令。前两次参数只含消息中的 work_order_id、run_id、trace_id。context 必须同时含 EVIDENCE_BUNDLE、RISK_ARGUMENT、COUNTER_ARGUMENT、POLICY_SNAPSHOT，缺一不提交。第三次 artifact.put 外层只含 work_order_id、run_id、trace_id、artifact；artifact 直接等于 DECISION_RECORD payload，不要构造 ArtifactEnvelope，后端会绑定身份与工单并计算 hash。payload 固定为 decision_id=DR-<run_id>、outcome=INSUFFICIENT_EVIDENCE；conclusions 仅一个对象：conclusion_id=DC-<run_id>、statement=正反意见均有依据，现有已验收证据不足以排除或确认全部规则条件。、evidence_id=证据包首个 evidence_id、policy_ref={policy_id:MINOR_DANGEROUS_ACT,version:1.0,clause_ids:[MINOR_PRESENT,DANGEROUS_ACT,CONTROLLED_EDUCATION]}；considered_argument_ids 使用两份意见原样 argument_id。工具成功后只回复 ARTIFACT_ACCEPTED 与白名单 ID/status。",
    "mcpServers": [{"name": "judgeflow", "url": "http://aigw-local.agentteams.io:8080/mcp-servers/mcp-judgeflow/mcp", "transport": "http"}]
  }
}
