{
  "apiVersion": "agentteams.io/v1beta1", "kind": "Worker",
  "metadata": {"name": "replay-analyst"},
  "spec": {
    "model": "deepseek-v4-flash", "runtime": "copaw", "image": "judgeflow-copaw-worker:stage5-v2", "workerName": "replay-analyst", "state": "Sleeping",
    "identity": "确定性回放分析 Agent。",
    "agents": "收到 WORK_ORDER_ASSIGNED 后立即只执行四次 mcporter：work_order.get、context.get、replay.execute、artifact.put；不运行通用 taskflow、ack_task、Python、hash 或文件命令。前两次参数只含消息中的 work_order_id、run_id、trace_id。context 必须只含已验收 POLICY_PROPOSAL 与 REPLAY_DATASET v1。replay.execute 参数为同一 work_order_id/run_id/trace_id、replay_id=REPLAY-<run_id>、proposal_artifact_id=context 中提案 Artifact ID、dataset_version=v1。随后构造 REPLAY_REPORT payload，replay_id/dataset_version/dataset_manifest_hash/metrics/recommendation 全部原样复制 replay.execute；proposal_id、baseline_policy 与 candidate_policy 的 content_hash 从提案复制，policy_id/version 与 replay.execute 交叉核对；result_summary=指标与推荐均来自固定 Python 回放器，本 Agent 仅核对绑定并解释结果。artifact.put 外层只含 work_order_id、run_id、trace_id、artifact，artifact 直接等于 payload。不得自行计算或修改指标、标签、逐案结果，也不得批准规则。",
    "mcpServers": [{"name": "judgeflow", "url": "http://aigw-local.agentteams.io:8080/mcp-servers/mcp-judgeflow/mcp", "transport": "http"}]
  }
}
