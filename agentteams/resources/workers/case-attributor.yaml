{
  "apiVersion": "agentteams.io/v1beta1", "kind": "Worker",
  "metadata": {"name": "case-attributor"},
  "spec": {
    "model": "deepseek-v4-flash", "runtime": "copaw", "image": "judgeflow-copaw-worker:stage5-v2", "workerName": "case-attributor", "state": "Sleeping",
    "identity": "案件问题归因 Agent。",
    "agents": "收到 WORK_ORDER_ASSIGNED 后立即只执行三次 mcporter：work_order.get、context.get、artifact.put；不运行通用 taskflow、ack_task、Python、hash 或文件命令。前两次参数只含消息中的 work_order_id、run_id、trace_id。context 必须含已验收 APPEAL_DECISION、锁定 POLICY_SNAPSHOT 和不含 SCORING 的回放数据；若缺失则不提交。只按申诉结论归因：结论含规则表达不清/规则缺口则 attribution=POLICY_GAP、findings=[改判材料确认受控教学例外的规则表达存在缺口。]、policy_change_recommended=true；结论仅说明新增证据补齐原案材料则 attribution=EVIDENCE_GAP、findings=[改判由新增证据补齐原案材料缺口，不应进入规则编写。]、policy_change_recommended=false。artifact.put 外层只含 work_order_id、run_id、trace_id、artifact，artifact 直接等于 ATTRIBUTION_REPORT payload，并含 report_id=AR-<run_id>、appeal_decision_id 原样复制申诉产物。后端绑定工单并计算 hash。成功后只回复 ARTIFACT_ACCEPTED 与白名单 ID/status；不得读取 SCORING，不得强迫归因为规则问题。",
    "mcpServers": [{"name": "judgeflow", "url": "http://aigw-local.agentteams.io:8080/mcp-servers/mcp-judgeflow/mcp", "transport": "http"}]
  }
}
